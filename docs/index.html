  document.addEventListener('keydown', unlockAudio, true);

  // ---------------------------------------------------------------- notes ---
  const sounding = new Set();
  function noteOn(note, vel) {
    if (!audio.running) message('Audio is off: click anywhere on the page once to enable it');
    audio.post({ type: 'noteOn', note, vel });
    sounding.add(note);
    toUi('notes', { on: [note], off: [] });
  }
  function noteOff(note) {
    audio.post({ type: 'noteOff', note });
    if (sounding.delete(note)) toUi('notes', { on: [], off: [note] });
  }
  function allOff() {
    const off = [...sounding];
    sounding.clear();
    if (off.length) toUi('notes', { on: [], off });
  }

  // ----------------------------------------------------------------- MIDI ---
  const midi = { access: null, selected: store.get('nostrings.midiInput') || 'all' };
  function midiInputs() {
    return midi.access ? Array.from(midi.access.inputs.values()).map(i => ({ id: i.id, name: i.name, state: i.state })) : [];
  }
  function bindMidi() {
    if (!midi.access) return;

      const on = midi.selected === 'all' || midi.selected === input.id;
      input.onmidimessage = on ? (e) => onMidi(e.data) : null;
    }

    const st = d[0];
    if (st >= 0xf0) return;
    const cmd = st & 0xf0;
    if (cmd === 0x90 && d[2] > 0) noteOn(d[1], d[2]);
    else if (cmd === 0x80 || cmd === 0x90) noteOff(d[1]);

      if (d[1] === 1) audio.post({ type: 'modWheel', value: v });
      else if (d[1] === 2) audio.post({ type: 'breath', value: v });
      else if (d[1] === 11) audio.post({ type: 'expression', value: v });

  // pushes the raw messages here, so a USB or Bluetooth keyboard works even where the
  // WebView has no Web MIDI. It also tells us the device names for the MIDI IN picker.

    message(bytes) { onMidi(bytes); },
    devices(list) {

      if (!midi.access) toUi('midiInputs', { inputs: native.devices.map((n, i) => ({ id: `native:${i}`, name: n, state: 'connected' })), selected: 'all' });

  };

  if (nativeMidiApp) queueMicrotask(() => window.NoStringsAndroid.midiReady());

      toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
      const n = midiInputs().length;
      message(n ? `MIDI ready: ${n} input(s): ${midiInputs().map(i => i.name).join(', ')}` : 'MIDI ready: no devices found (plug one in, it appears automatically)');
    }).catch((e) => {
      toUi('midiInputs', { inputs: [], selected: 'all', error: true });
      message(`MIDI unavailable: ${e.message || e}`);

    queueMicrotask(() => toUi('midiInputs', { inputs: [], selected: 'all', error: true }));
  }

  // -------------------------------------------------------------- combine ---
  // Mirror of core/Combine.h: a new excitation x body x material x sympathetic
  // combination within musical limits. Same RNG as the plugin.
  const rng = { s: (Date.now() ^ 0xC0FFEE) >>> 0,
    next() { this.s = (Math.imul(this.s, 1664525) + 1013904223) >>> 0; return this.s; },
    uni() { return (this.next() >>> 8) * (1 / 16777216); } };

    const range = (lo, hi) => lo + (hi - lo) * rng.uni();

    read() { try { return JSON.parse(store.get(LS_KEY)) || {}; } catch (e) { return {}; } },
    write(obj) { return store.set(LS_KEY, JSON.stringify(obj)); },
  };
  const localPresets = () => Object.keys(local.read()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map(name => ({ id: `local:${name}`, name, category: 'User', factory: false }));

  const fsSupported = typeof window.showDirectoryPicker === 'function';
  const folder = { handle: null, granted: false, files: [], sig: '' };
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('nostrings', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
  };

  async function scanFolder() {
    if (!folder.handle || !folder.granted) return false;
    const files = [];
    async function walk(dir, path) {
      for await (const [name, h] of dir.entries()) {
        const rel = path ? `${path}/${name}` : name;
        if (h.kind === 'directory') await walk(h, rel);
        else if (name.toLowerCase().endsWith(PRESET_EXT)) {
          const f = await h.getFile();
          files.push({ id: `user:${rel}`, name: name.slice(0, -PRESET_EXT.length), category: path || 'User',
                       factory: false, handle: h, parent: dir, fileName: name, stamp: `${f.size}:${f.lastModified}` });
        }
      }
    }
    try { await walk(folder.handle, ''); } catch (e) { folder.granted = false; return true; }
    files.sort((a, b) => a.category.localeCompare(b.category) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    const sig = files.map(f => `${f.id}|${f.stamp}`).join(';');
    if (sig === folder.sig) return false;
    folder.sig = sig;
    folder.files = files;
    return true;
  }

  function allPresets() { return [...FACTORY, ...folder.files, ...localPresets()]; }
  function sendPresetList() {
    toUi('presetList', {
      presets: allPresets().map(({ id, name, category, factory }) => ({ id, name, category, factory })),
      folder: folder.granted ? `${folder.handle.name} (linked folder)` : 'this browser (click FOLDER to link a folder on disk)',
    });
  }

  async function linkFolder(handle, ask) {
    folder.handle = handle;
    folder.sig = '';
    let state = await handle.queryPermission({ mode: 'readwrite' });
    if (state !== 'granted' && ask) state = await handle.requestPermission({ mode: 'readwrite' });
    folder.granted = state === 'granted';
    await idb.set('presetFolder', handle);
    if (folder.granted) await scanFolder();
    sendPresetList();
    return folder.granted;
  }
  if (fsSupported && window.indexedDB) {
    idb.get('presetFolder').then(async (h) => {
      if (h && !(await linkFolder(h, false))) message(`Click FOLDER to reconnect the preset folder "${h.name}"`);
    }).catch(() => {});
  }
  setInterval(async () => { if (await scanFolder()) sendPresetList(); }, 2000); // autoload

  function parsePresetText(text, fallbackName) {
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(`Not a valid preset file: ${fallbackName}`); }
    const params = json && typeof json.params === 'object' ? json.params : null;
    if (!params || !PARAM_DEFS.some(d => !d.noPreset && d.id in params)) throw new Error(`No No Strings settings found in ${fallbackName}`);
    return { name: String(json.name || '').trim() || fallbackName, params };
  }
  function presetText(name, category) {
    const params = {};
    for (const d of PARAM_DEFS) if (!d.noPreset) params[d.id] = +Number(values[d.id]).toPrecision(6);
    return JSON.stringify({ format: 'No Strings Preset', version: 1, name, category, params }, null, 2);
  }
  const legalName = (s) => s.trim().replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);

  async function loadPresetById(id) {
    const p = allPresets().find(x => x.id === id);
    if (!p) { message('Preset not found (was it moved or deleted?)'); toUi('preset', current); return; }
    try {
      const info = { id, name: p.name, category: p.category };
      if (p.factory) applyPreset(p.values, info);
      else {
        const text = id.startsWith('local:') ? local.read()[p.name] : await (await p.handle.getFile()).text();
        applyPreset(parsePresetText(text, p.name).params, info);
      }
    } catch (e) { message(e.message || String(e)); toUi('preset', current); }
  }

  async function savePreset(rawName, overwrite) {
    const name = legalName(rawName);
    const result = (r) => toUi('saveResult', Object.assign({ name }, r));
    if (!name) return result({ ok: false, error: 'Enter a name for the preset' });
    try {
      if (folder.granted) {
        const fileName = name + PRESET_EXT;
        if (!overwrite) {
          let exists = true;
          try { await folder.handle.getFileHandle(fileName); } catch (e) { exists = false; }
          if (exists) return result({ ok: false, exists: true });
        }
        const w = await (await folder.handle.getFileHandle(fileName, { create: true })).createWritable();
        await w.write(presetText(name, 'User'));
        await w.close();
        await scanFolder();
        current = { id: `user:${fileName}`, name, category: 'User' };
      } else {
        const all = local.read();
        if (!overwrite && all[name]) return result({ ok: false, exists: true });
        all[name] = presetText(name, 'User');
        if (!local.write(all)) throw new Error('browser storage is unavailable (private window?)');
        current = { id: `local:${name}`, name, category: 'User' };
      }
      sendPresetList();
      toUi('preset', current);
      result({ ok: true });
    } catch (e) { result({ ok: false, error: e.message || String(e) }); }
  }

  async function deletePreset(id) {
    const p = allPresets().find(x => x.id === id);
    try {
      if (!p || p.factory) throw new Error('Only user presets can be deleted');
      if (id.startsWith('local:')) { const all = local.read(); delete all[p.name]; local.write(all); }
      else { await p.parent.removeEntry(p.fileName); await scanFolder(); }
      if (current.id === id) current = { id: '', name: current.name, category: 'User' };
      message(`Deleted preset "${p.name}"`);
    } catch (e) { message(e.message || String(e)); }
    sendPresetList();
    toUi('preset', current);
  }

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = `${PRESET_EXT},application/json`;
  fileInput.style.display = 'none';
  document.addEventListener('DOMContentLoaded', () => document.body.appendChild(fileInput));
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    try {
      const p = parsePresetText(await f.text(), f.name.replace(/\.[^.]+$/, ''));
      applyPreset(p.params, { id: `file:${f.name}`, name: p.name, category: 'File' });
      message(`Loaded ${f.name}`);
    } catch (e) { message(e.message || String(e)); }
  });

  async function folderButton() {
    if (!fsSupported) { message('Linking a preset folder needs Chrome or Edge: presets are saved in this browser instead.'); return; }
    try {
      if (folder.handle && !folder.granted) { if (await linkFolder(folder.handle, true)) message(`Reconnected "${folder.handle.name}"`); return; }
      const handle = await window.showDirectoryPicker({ id: 'nostrings-presets', mode: 'readwrite', startIn: 'documents' });
      await linkFolder(handle, true);
      message(`Preset folder linked: ${handle.name}: ${folder.files.length} preset(s). Link Documents\\No Strings\\Presets to share presets with the VST.`);
    } catch (e) { if (e && e.name !== 'AbortError') message(`Folder: ${e.message || e}`); }
  }

  // ------------------------------------------------- UI -> host events ---
  Object.assign(handlers, {
    uiReady() {
      sendConfig();
      sendPresetList();
      toUi('params', Object.assign({}, values));
      toUi('preset', current);
      toUi('stats', { voices: 0, peak: 0, sustain: false, modWheel: 0, excitation: Math.round(values.excitation) });
      if (midi.access) toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
    },
    paramMenu() {}, // no host automation menu in a browser
    setParam({ id, value }) { if (id in values) { values[id] = value; audio.post({ type: 'param', id, value }); } },
    gesture() {},
    noteOn({ note, vel }) { noteOn(note, vel); },
    noteOff({ note }) { noteOff(note); },
    panic() { audio.post({ type: 'panic' }); allOff(); },
    modWheel({ value }) { audio.post({ type: 'modWheel', value }); },
    selectMidi({ id }) { midi.selected = id; store.set('nostrings.midiInput', id); bindMidi(); },
    loadPreset({ id }) { loadPresetById(id); },
    savePreset({ name, overwrite }) { savePreset(name, overwrite); },
    deletePreset({ id }) { deletePreset(id); },
    loadPresetFile() { fileInput.click(); },
    openPresetFolder() { folderButton(); },
    combine() { combine(); },
  });
})();

</script>
<script>
// ============================================================================
//  JUCE bridge: the UI's connection to the C++ processor through JUCE 8's
//  native integration (window.__JUCE__.backend), which JUCE injects into the
//  page. The web build (stage 9) provides the same bridge on top of Web Audio.
// ============================================================================
'use strict';

class JuceEngine {
  constructor() {
    this.backend = (window.__JUCE__ && window.__JUCE__.backend) || null;
    this.connected = !!this.backend;
    this.ready = true;
    this.handlers = {};
    if (this.backend) {
      for (const ev of ['params', 'notes', 'stats', 'config', 'presetList', 'preset', 'saveResult', 'message', 'midiInputs']) {
        this.backend.addEventListener(ev, (data) => { if (this.handlers[ev]) this.handlers[ev](data); });
      }
    }
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(id, payload) { if (this.backend) this.backend.emitEvent(id, payload || {}); }

  start() { return Promise.resolve(); }
  uiReady() { this.emit('uiReady'); }

  // parameters
  setParam(id, value) { this.emit('setParam', { id, value }); }
  beginGesture(id) { this.emit('gesture', { id, begin: true }); }
  endGesture(id) { this.emit('gesture', { id, begin: false }); }

  // notes
  noteOn(note, vel) { this.emit('noteOn', { note, vel }); }
  noteOff(note) { this.emit('noteOff', { note }); }
  panic() { this.emit('panic'); }
  modWheel(value) { this.emit('modWheel', { value }); }

  // right-click on a control -> the host's parameter menu (automation, MIDI learn...)
  paramMenu(id, x, y) { this.emit('paramMenu', { id, x: Math.round(x), y: Math.round(y) }); }

  // web build only (the plugin takes MIDI from the host)
  selectMidi(id) { this.emit('selectMidi', { id }); }

  // presets
  loadPreset(id) { this.emit('loadPreset', { id }); }
  savePreset(name, overwrite) { this.emit('savePreset', { name, overwrite: !!overwrite }); }
  deletePreset(id) { this.emit('deletePreset', { id }); }
  loadPresetFile() { this.emit('loadPresetFile'); }
  openPresetFolder() { this.emit('openPresetFolder'); }
  combine() { this.emit('combine'); }
}

  <script>
// ============================================================================
//  SVG rotary knob.
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.setValue(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey);
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
    });
  }
}

</script>
  <script>
// ============================================================================
//  Parameter controls besides the knob. Same conventions as Knob:
//  setValue(v) updates the display, onChange(v) fires on user edits.
//    ToggleButton - bool param   (click; double-click = default)
//    Segmented    - choice param (click; wheel / arrow keys step; double-click = default)
//    SelectBox    - choice param (native dropdown; wheel steps; double-click = default)
//    ModWheel     - SVG performance wheel (drag, wheel, arrow keys, double-click = 0)
// ============================================================================
'use strict';

class ToggleButton {
  constructor(def, value, onChange, label) {
    this.def = def;
    this.onChange = onChange;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'power';
    b.innerHTML = `<span class="led"></span><span>${label || 'ON'}</span>`;
    b.addEventListener('click', () => this.onChange(this.value >= 0.5 ? 0 : 1));
    this.el = b;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.setAttribute('aria-pressed', v >= 0.5);
  }
}

class Segmented {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    wrap.setAttribute('role', 'radiogroup');
    wrap.setAttribute('aria-label', def.name);
    this.buttons = (labels || def.choices).map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => this.pick(i));
      wrap.appendChild(b);
      return b;
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.pick(this.value + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    wrap.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.pick(this.value + dir); this.buttons[this.value].focus(); }
    });
    wrap.addEventListener('dblclick', () => this.pick(this.def.def));
    this.el = wrap;
    this.setValue(value);
  }
  pick(i) {
    i = clamp(Math.round(i), 0, this.buttons.length - 1);
    if (i !== this.value) this.onChange(i);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.buttons.length - 1);
    this.buttons.forEach((b, i) => { b.classList.toggle('on', i === this.value); b.setAttribute('aria-checked', i === this.value); });
  }
}

class SelectBox {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const s = document.createElement('select');
    s.className = 'param-select';
    s.setAttribute('aria-label', def.name);
    (labels || def.choices).forEach((label, i) => s.appendChild(new Option(label, String(i))));
    s.addEventListener('change', () => this.onChange(Number(s.value)));
    s.addEventListener('wheel', (e) => {
      e.preventDefault();
      const i = clamp(this.value + (e.deltaY < 0 ? -1 : 1), 0, s.options.length - 1);
      if (i !== this.value) this.onChange(i);
    }, { passive: false });
    s.addEventListener('dblclick', () => { if (this.value !== this.def.def) this.onChange(this.def.def); });
    s.addEventListener('keydown', (e) => e.stopPropagation()); // arrow keys belong to the dropdown, not the piano
    this.el = s;
    this.setValue(value);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.el.options.length - 1);
    this.el.value = String(this.value);
  }
}

class ModWheel {
  constructor(onChange, onGesture) {
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = 0;
    this.drag = null;
    const H = 110, W = 26, T = 16;
    this.H = H; this.T = T;
    const ridges = Array.from({ length: 14 }, (_, i) => `<line x1="4" x2="${W - 4}" y1="${6 + i * 7.5}" y2="${6 + i * 7.5}"/>`).join('');
    const el = document.createElement('div');
    el.className = 'wheel-ctl';
    el.innerHTML = `
      <svg class="wheel-svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="slider" aria-label="Mod wheel"
           aria-valuemin="0" aria-valuemax="127">
        <rect class="wh-slot" x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="5"/>
        <g class="wh-ridges">${ridges}</g>
        <rect class="wh-fill" x="3" width="${W - 6}" rx="3"/>
        <rect class="wh-thumb" x="2" width="${W - 4}" height="${T}" rx="3"/>
      </svg>
      <span class="ctl-label">MOD</span>
      <span class="wheel-value">0</span>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.thumb = el.querySelector('.wh-thumb');
    this.fill = el.querySelector('.wh-fill');
    this.readout = el.querySelector('.wheel-value');
    this.bind();
    this.render();
  }

  set(v, notify) {
    v = clamp(v, 0, 1);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify) this.onChange(v);
  }
  setValue(v) { if (!this.drag) this.set(v, false); }

  render() {
    const y = (this.H - this.T - 4) * (1 - this.value) + 2;
    this.thumb.setAttribute('y', y.toFixed(1));
    this.fill.setAttribute('y', (y + this.T / 2).toFixed(1));
    this.fill.setAttribute('height', Math.max(0, this.H - 3 - (y + this.T / 2)).toFixed(1));
    const midi = Math.round(this.value * 127);
    this.readout.textContent = midi;
    this.svg.setAttribute('aria-valuenow', String(midi));
  }

  bind() {
    const svg = this.svg;
    const fromY = (clientY) => {
      const r = svg.getBoundingClientRect();
      return 1 - (clientY - r.top - (this.T / 2) * (r.height / this.H)) / (r.height * (this.H - this.T) / this.H);
    };
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, v: this.value };
      if (this.onGesture) this.onGesture(true);
      if (!e.shiftKey) this.set(fromY(e.clientY), true); // click jumps, Shift-drag is relative + fine
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      if (e.shiftKey) {
        this.drag.v = clamp(this.drag.v + (this.drag.y - e.clientY) * 0.002, 0, 1);
        this.drag.y = e.clientY;
        this.set(this.drag.v, true);
      } else {
        this.drag.y = e.clientY;
        this.drag.v = fromY(e.clientY);
        this.set(this.drag.v, true);
      }
    });
    const end = () => { if (!this.drag) return; this.drag = null; if (this.onGesture) this.onGesture(false); };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.set(0, true));
    svg.addEventListener('wheel', (e) => { e.preventDefault(); this.set(this.value + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 1 / 127 : 8 / 127), true); }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];

  <script>
// ============================================================================
//  24-key SVG piano in ebony and boxwood: naturals are dark, sharps are pale.
//  Keyswitch keys (see setKeyswitches) are marked and labelled.
//  Click/touch to play, drag for glissando. Velocity = how far down the key
//  you click (lower = harder), like striking nearer the front edge.
// ============================================================================
'use strict';

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const BLACK_PCS = new Set([1, 3, 6, 8, 10]);

function midiNoteName(n) { return NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1); }

class Piano {
  constructor(container, { numKeys = 24, baseNote = 48, onNoteOn, onNoteOff }) {
    this.numKeys = numKeys;
    this.base = baseNote; // must be a C
    this.onNoteOn = onNoteOn;
    this.onNoteOff = onNoteOff;
    this.active = new Set();     // sounding MIDI notes (from any source)
    this.ks = { lo: -1, hi: -1, labels: [] };   // keyswitch range + short labels
    this.pointers = new Map();   // pointerId -> note
    this.keys = [];
    this.build(container);
  }

  build(container) {
    const WW = 40, WH = 200, BW = 24, BH = 122, TOP = 10;
    const whites = [], blacks = [];
    let wi = 0;
    for (let i = 0; i < this.numKeys; i++) {
      if (BLACK_PCS.has(i % 12)) {
        blacks.push(`<rect class="bkey" data-idx="${i}" x="${wi * WW - BW / 2}" y="${TOP}" width="${BW}" height="${BH}" rx="3"/>`);
      } else {
        whites.push(`<rect class="wkey" data-idx="${i}" x="${wi * WW + 1}" y="${TOP}" width="${WW - 2}" height="${WH}" rx="4"/>`);
        if (i % 12 === 0) whites.push(`<text class="klabel" data-label="${i}" x="${wi * WW + WW / 2}" y="${TOP + WH - 12}"></text>`);
        wi++;
      }
    }
    const W = wi * WW;
    container.innerHTML = `
      <svg class="piano-svg" viewBox="0 0 ${W} ${TOP + WH + 2}" preserveAspectRatio="xMidYMid meet">
        ${whites.join('')}
        ${blacks.join('')}
        <rect class="felt" x="0" y="0" width="${W}" height="${TOP + 2}"/>
      </svg>`;
    this.svg = container.querySelector('svg');
    this.keys = Array.from({ length: this.numKeys }, (_, i) => this.svg.querySelector(`[data-idx="${i}"]`));
    this.labels = Array.from(this.svg.querySelectorAll('[data-label]'));
    this.bindPointer();
    this.render();
  }

  setBase(note) {
    this.base = note;
    this.render();
  }

  // Keyswitch keys: MIDI lo..lo+labels.length-1 (lo < 0 = none)
  setKeyswitches(lo, labels) {
    this.ks = { lo, hi: lo + labels.length - 1, labels };
    this.render();
  }

  setNote(note, on) {
    if (on) this.active.add(note); else this.active.delete(note);
    const i = note - this.base;
    if (i >= 0 && i < this.numKeys) this.keys[i].classList.toggle('down', on);
  }

  clear() {
    this.active.clear();
    this.render();
  }

  render() {
    this.keys.forEach((k, i) => {
      const n = this.base + i;
      k.classList.toggle('down', this.active.has(n));
      const isKs = n >= this.ks.lo && n <= this.ks.hi;
      k.classList.toggle('ks', isKs);
    });
    this.labels.forEach(t => { t.textContent = midiNoteName(this.base + Number(t.dataset.label)); });
    // keyswitch labels sit on the keys themselves
    this.svg.querySelectorAll('.kslabel').forEach(e => e.remove());
    if (this.ks.lo >= 0) {
      for (let i = 0; i < this.numKeys; i++) {
        const n = this.base + i;
        if (n < this.ks.lo || n > this.ks.hi) continue;
        const k = this.keys[i];
        const x = Number(k.getAttribute('x')) + Number(k.getAttribute('width')) / 2;
        const black = k.classList.contains('bkey');
        const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        t.setAttribute('class', 'kslabel' + (black ? ' on-black' : ''));
        t.setAttribute('x', x);
        t.setAttribute('y', black ? 60 : 150);
        t.setAttribute('transform', `rotate(-90 ${x} ${black ? 60 : 150})`);
        t.textContent = this.ks.labels[n - this.ks.lo];
        this.svg.appendChild(t);
      }
    }
  }

  hit(x, y) {
    const t = document.elementFromPoint(x, y);
    if (!t || !this.svg.contains(t) || !t.dataset.idx) return null;
    const r = t.getBoundingClientRect();
    const depth = clamp((y - r.top) / r.height, 0, 1);
    return { note: this.base + Number(t.dataset.idx), vel: Math.round(30 + depth * 97) };
  }

  bindPointer() {
    const svg = this.svg;
    const press = (id, x, y) => {
      const h = this.hit(x, y);
      if (!h) return;
      this.pointers.set(id, h.note);
      this.onNoteOn(h.note, h.vel);
    };
    const lift = (id) => {
      const n = this.pointers.get(id);
      if (n !== undefined && n !== null) this.onNoteOff(n);
      this.pointers.delete(id);
    };
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      press(e.pointerId, e.clientX, e.clientY);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      const h = this.hit(e.clientX, e.clientY);
      const cur = this.pointers.get(e.pointerId);
      const next = h ? h.note : null;
      if (next === cur) return;
      if (cur !== null) this.onNoteOff(cur);
      this.pointers.set(e.pointerId, next);
      if (h) this.onNoteOn(h.note, h.vel);
    });
    svg.addEventListener('pointerup', (e) => lift(e.pointerId));
    svg.addEventListener('pointercancel', (e) => lift(e.pointerId));
  }
}

  <script>
// ============================================================================
//  Cello graphics (SVG): the fixed logo in the top-left corner, and the
//  picture of the selected body in the BODY panel. Everything is drawn from
//  a few paths so each body gets its own shape, finish and string count.
// ============================================================================
'use strict';

// Classic violin-family outline, upright, in a 200 x 330 box (x centred on 100).
const CELLO_OUTLINE =
  'M100 70 C140 68 168 95 168 135 C168 155 158 162 142 165 C136 182 136 198 142 212 ' +
  'C165 218 180 240 180 265 C180 305 150 330 100 330 C50 330 20 305 20 265 C20 240 35 218 58 212 ' +
  'C64 198 64 182 58 165 C42 162 32 155 32 135 C32 95 60 68 100 70 Z';

// Guitar-shaped outline (the arpeggione): a waist instead of C-bouts.
const GUITAR_OUTLINE =
  'M100 72 C148 72 172 100 170 140 C168 160 152 170 150 184 C152 204 186 216 186 256 ' +
  'C186 306 150 330 100 330 C50 330 14 306 14 256 C14 216 48 204 50 184 C48 170 32 160 30 140 C28 100 52 72 100 72 Z';

// Narrow solid body (electric): a stick with a small wing.
const SLAB_OUTLINE = 'M84 60 L116 60 L122 150 L138 162 L130 300 L70 300 L62 162 L78 150 Z';

function fHoles(x1, x2, y0, h, cls) {
  const hole = (x, flip) =>
    `<path class="${cls}" d="M${x} ${y0} c${flip ? 10 : -10} ${h * 0.22} ${flip ? 10 : -10} ${h * 0.7} 0 ${h}"/>` +
    `<circle class="${cls}" cx="${x}" cy="${y0}" r="3.2"/><circle class="${cls}" cx="${x}" cy="${y0 + h}" r="3.2"/>`;
  return hole(x1, false) + hole(x2, true);
}

function strings(n, yTop, yBottom, spreadTop, spreadBottom, cls) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const t = n === 1 ? 0.5 : i / (n - 1);
    const xt = 100 - spreadTop / 2 + spreadTop * t, xb = 100 - spreadBottom / 2 + spreadBottom * t;
    s += `<line class="${cls}" x1="${xt.toFixed(1)}" y1="${yTop}" x2="${xb.toFixed(1)}" y2="${yBottom}" style="stroke-width:${(0.7 + (n - 1 - i) * 0.35).toFixed(2)}"/>`;
  }
  return s;
}

// The small fixed logo (brass line art). Does not change with the body.
function celloLogoSvg() {
  return `
    <svg class="logo-svg" viewBox="0 0 200 340" aria-label="No Strings cello logo" role="img">
      <path class="logo-body" d="${CELLO_OUTLINE}"/>
      <path class="logo-line" d="M92 76 L92 12 M108 76 L108 12"/>
      <path class="logo-line" d="M100 10 c-14 -2 -16 16 -4 16 c8 0 8 -10 2 -10"/>
      ${fHoles(70, 130, 200, 62, 'logo-line')}
      <path class="logo-line" d="M80 240 L120 240 L118 250 L82 250 Z"/>
      ${strings(4, 20, 290, 12, 14, 'logo-string')}
      <path class="logo-line" d="M93 272 L107 272 L104 318 L96 318 Z"/>
    </svg>`;
}

// The selected body, for the BODY panel.
//  info: { name, strings[], fretted, electric, shape: 'cello'|'guitar'|'slab'|'frame' }
function bodyPictureSvg(info) {
  const n = info.strings.length;
  const name = info.name.toLowerCase();
  const scale = name.includes('piccolo') ? 0.86 : 1;
  const finish = name.includes('carbon') ? 'carbon' : name.includes('baroque') ? 'baroque'
               : name.includes('arpeggione') ? 'arpeggione' : info.electric ? 'electric' : 'varnish';
  let inner = '';
  const ox = (200 - 200 * scale) / 2, oy = 330 - 330 * scale;
  inner += `<g transform="translate(${ox} ${oy}) scale(${scale})">`;

  if (info.shape === 'frame') {
    // skeleton / silent cello: the silhouette as an open frame, a centre spine and a chest rest
    inner += `<path class="bp-frame" d="${CELLO_OUTLINE}"/>`;
    inner += `<rect class="bp-spine" x="86" y="60" width="28" height="275" rx="6"/>`;
    inner += `<path class="bp-frame" d="M30 150 C60 160 140 160 170 150"/>`;
    inner += `<rect class="bp-frame" x="116" y="210" width="44" height="10" rx="4"/>`;
  } else if (info.shape === 'slab') {
    inner += `<path class="bp-body bp-${finish}" d="${SLAB_OUTLINE}"/>`;
    inner += `<circle class="bp-knob" cx="122" cy="276" r="6"/><circle class="bp-knob" cx="122" cy="292" r="4.5"/>`;
  } else {
    const outline = info.shape === 'guitar' ? GUITAR_OUTLINE : CELLO_OUTLINE;
    inner += `<path class="bp-body bp-${finish}" d="${outline}"/>`;
    inner += `<path class="bp-purfling" d="${outline}" transform="translate(100 200) scale(0.955) translate(-100 -200)"/>`;
    inner += fHoles(70, 130, 198, 64, 'bp-fhole');
  }

  // neck, fingerboard, pegbox, scroll
  inner += `<path class="bp-neck" d="M91 12 L109 12 L111 80 L89 80 Z"/>`;
  inner += `<path class="bp-fingerboard" d="M90 0 L110 0 L113 ${info.shape === 'slab' ? 150 : 190} L87 ${info.shape === 'slab' ? 150 : 190} Z"/>`;
  if (info.fretted) for (let f = 1; f <= 12; f++) {
    const y = 14 + 150 * (1 - Math.pow(2, -f / 12)) * 1.9;
    inner += `<line class="bp-fret" x1="88" y1="${y.toFixed(1)}" x2="112" y2="${y.toFixed(1)}"/>`;
  }
  inner += `<path class="bp-scroll" d="M100 6 c-15 -4 -18 16 -5 16 c9 0 9 -11 2 -11"/>`;
  // bridge, tailpiece, strings
  const bridgeY = info.shape === 'slab' ? 235 : 242;
  inner += `<path class="bp-bridge" d="M79 ${bridgeY - 4} L121 ${bridgeY - 4} L119 ${bridgeY + 9} L81 ${bridgeY + 9} Z"/>`;
  inner += `<path class="bp-tail" d="M92 ${bridgeY + 32} L108 ${bridgeY + 32} L105 ${bridgeY + 78} L95 ${bridgeY + 78} Z"/>`;
  inner += strings(n, 14, bridgeY + 34, 4 + n * 2.2, 6 + n * 2.4, 'bp-string');
  if (!info.electric) inner += `<rect class="bp-endpin" x="98.5" y="330" width="3" height="10"/>`;
  inner += '</g>';

  return `<svg class="body-svg" viewBox="-10 -4 220 348" role="img" aria-label="${info.name} cello">${inner}</svg>`;
}

  <script>
// ============================================================================
//  UI wiring: shared by the plugin and the web build.
//   - talks only to JuceEngine (engine-juce.js). In the plugin that is JUCE's
//     native bridge to C++; in the web build the web host provides the same
//     bridge on top of Web Audio + Web MIDI.
//   - the host owns all parameter state; automation, preset loads and MIDI
//     notes flow back in as events
//   - the whole panel scales to fit the window
// ============================================================================
(function () {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // ---------------------------------------------------------------- state ---
  const values = defaultParamValues();      // replaced by the plugin's state on connect
  let presetList = [];                      // [{id, name, category, factory}]
  let presetFolder = '';
  let current = { id: '', name: 'Init', category: '' };
  let presetDirty = false;
  let activeCat = null;

  const engine = new JuceEngine();
  const knobs = {};
  const bound = {};             // id -> [controls with setValue()]
  const dragging = new Set();   // params being dragged in the UI
  const lastLocal = {};         // id -> time of last UI-side change

  // ---------------------------------------------------- parameter plumbing ---
  function applyValue(id, v) {
    values[id] = v;
    if (knobs[id]) knobs[id].setValue(v);
    (bound[id] || []).forEach(c => c.setValue(v));
  }

  // A change made in this UI
  function setParam(id, v) {
    lastLocal[id] = performance.now();
    applyValue(id, v);
    engine.setParam(id, v);
    if (!PARAM_BY_ID[id].noPreset && !presetDirty) { presetDirty = true; renderPresetName(); }
    refresh(PARAM_BY_ID[id].group);
  }

  function knob(container, id) {
    const def = PARAM_BY_ID[id];
    const k = new Knob(def, values[id], (v) => setParam(id, v), (begin) => {
      if (begin) { dragging.add(id); engine.beginGesture(id); }
      else { dragging.delete(id); engine.endGesture(id); }
    });
    k.el.dataset.param = id;
    knobs[id] = k;
    container.appendChild(k.el);
    return k;
  }

  // Bind a non-knob control (ToggleButton / Segmented / SelectBox) to a param
  function control(Cls, id, ...extra) {
    const c = new Cls(PARAM_BY_ID[id], values[id], (v) => setParam(id, v), ...extra);
    (bound[id] = bound[id] || []).push(c);
    c.el.dataset.param = id;
    return c;
  }

  // A labelled dropdown in a select grid
  function field(container, id, label) {
    const f = el('div', 'field');
    f.appendChild(el('span', 'ctl-label', esc(label || PARAM_BY_ID[id].name)));
    const c = control(SelectBox, id);
    f.appendChild(c.el);
    f.dataset.field = id;
    container.appendChild(f);
    return f;
  }

  // Changes coming from the plugin (automation, presets, state restore)
  engine.on('params', (obj) => {
    const now = performance.now();
    const groups = new Set();
    for (const id in obj) {
      if (!PARAM_BY_ID[id]) continue;
      // don't fight the user's hand: skip params being dragged or changed here in the last 300 ms
      if (dragging.has(id) || (lastLocal[id] !== undefined && now - lastLocal[id] < 300)) continue;
      applyValue(id, obj[id]);
      groups.add(PARAM_BY_ID[id].group);
    }
    groups.forEach(g => refresh(g));
  });

  // ------------------------------------------------------------ presets ----
  engine.on('presetList', ({ presets, folder }) => {
    presetList = presets || [];
    presetFolder = folder || '';
    if (!activeCat || !categories().includes(activeCat)) activeCat = current.category || (presetList[0] && presetList[0].category) || 'User';
    renderBrowser();
  });

  engine.on('preset', (p) => {
    const changed = p.id !== current.id || p.name !== current.name;
    current = p;
    if (changed) presetDirty = false;
    if (p.category && categories().includes(p.category)) activeCat = p.category;
    renderPresetName();
    renderBrowser();
  });

  engine.on('message', ({ text }) => logMidi(text));

  function categories() {
    const cats = [];
    for (const p of presetList) if (!cats.includes(p.category)) cats.push(p.category);
    if (!presetList.some(p => !p.factory) && !cats.includes('User')) cats.push('User');
    return cats;
  }

  function loadPreset(p) {
    presetDirty = false;
    current = { id: p.id, name: p.name, category: p.category };
    for (const id in lastLocal) delete lastLocal[id]; // let all incoming values through
    renderPresetName();
    renderBrowser();
    engine.loadPreset(p.id); // plugin applies the values and sends them back
  }

  function stepPreset(dir) {
    if (!presetList.length) return;
    const i = presetList.findIndex(p => p.id === current.id);
    const next = i < 0 ? 0 : (i + dir + presetList.length) % presetList.length;
    loadPreset(presetList[next]);
  }

  function renderPresetName() {
    $('#preset-name').textContent = current.name + (presetDirty ? ' *' : '');
    $('#preset-cat').textContent = (current.category || 'Preset').toUpperCase();
  }

  const tabsEl = $('#cat-tabs');
  const gridEl = $('#preset-grid');

      t.type = 'button';
      t.setAttribute('role', 'tab');
      t.addEventListener('click', () => { activeCat = c; renderBrowser(); });

    if (!shown.length) {
      gridEl.appendChild(el('div', 'preset-empty', 'No user presets yet: press SAVE to keep this sound, or COMBINE to find a new one.'));

      b.addEventListener('click', (e) => {
        if (e.target.classList.contains('del')) {

          return;
        }

      gridEl.appendChild(b);
    }
  }

  $('#preset-prev').addEventListener('click', () => stepPreset(-1));
  $('#preset-next').addEventListener('click', () => stepPreset(1));
  $('#preset-load').addEventListener('click', () => engine.loadPresetFile());
  $('#preset-folder').addEventListener('click', () => engine.openPresetFolder());
  $('#combine-btn').addEventListener('click', () => { for (const id in lastLocal) delete lastLocal[id]; engine.combine(); });
  $('#preset-save').addEventListener('click', () => {
    promptModal('Save preset', 'Saved to ' + (presetFolder ? `<b>${esc(presetFolder)}</b>` : 'the preset folder') + ' as a .nspreset file.',
      current.name.replace(/ \*$/, ''), (name) => engine.savePreset(name, false));
  });
  engine.on('saveResult', ({ ok, exists, name, error }) => {

  });

  // --------------------------------------------------------------- modal ---
  const modal = $('#modal'), modalInput = $('#modal-input');
  let modalOk = null;
  function openModal(title, body, withInput, value, onOk) {
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = body;
    modalInput.classList.toggle('hidden', !withInput);
    modalInput.value = value || '';
    modalOk = onOk;
    modal.classList.remove('hidden');
    if (withInput) { modalInput.focus(); modalInput.select(); } else $('#modal-ok').focus();
  }
  function closeModal() { modal.classList.add('hidden'); modalOk = null; }
  function promptModal(title, body, value, onOk) { openModal(title, body, true, value, () => { const v = modalInput.value.trim(); if (v) onOk(v); }); }
  function confirmModal(title, body, onOk) { openModal(title, body, false, '', onOk); }
  $('#modal-ok').addEventListener('click', () => { const f = modalOk; closeModal(); if (f) f(); });
  $('#modal-cancel').addEventListener('click', closeModal);
  modal.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') { const f = modalOk; closeModal(); if (f) f(); }
    if (e.key === 'Escape') closeModal();
  });

  // ------------------------------------------------------------- panels ----
  // Excitation
  $('#logo').innerHTML = celloLogoSvg();
  $('#excite-select').appendChild(control(SelectBox, 'excitation').el);
  ['bowPressure', 'bowSpeed', 'bowPosition'].forEach(id => knob($('#excite-knobs'), id));
  knob($('#excite-extra'), 'harmonic');
  knob($('#excite-extra'), 'malletHardness');
  const ebowField = field($('#excite-extra'), 'ebowMode', 'EBow');
  ebowField.style.flex = '1';

  // Body
  $('#body-select').appendChild(control(SelectBox, 'body').el);
  const BODY_DESC = [
    'Warm, full and even: the reference sound.',
    'Lighter build, sweeter and less projecting; made for gut.',
    'A modern cello with a high E string for the upper register.',
    'Bright, focused and very projecting; hardly any wolf.',
    'A smaller body: higher, more nasal, quick to speak.',
    'Fretted, guitar-shaped and bowed: six strings in guitar tuning.',
    'Solid body with a piezo pickup, through the amp / DI stage below.',
    'A silent frame: a hint of body, close-miked and intimate.',
  ];
  ['ampDrive', 'ampBass', 'ampMid', 'ampTreble'].forEach(id => knob($('#amp-knobs'), id));
  $('#amp-cab').appendChild(control(ToggleButton, 'ampCab', 'CAB').el);

  // Strings
  $('#strings-select').appendChild(control(SelectBox, 'material').el);
  ['tension', 'age', 'releaseTime'].forEach(id => knob($('#strings-knobs'), id));

  // Sympathetic
  $('#symp-power').appendChild(control(ToggleButton, 'sympOn', 'ON').el);
  ['sympAmount', 'sympCount', 'sympDecay', 'sympBright'].forEach(id => knob($('#symp-knobs'), id));
  field($('#symp-selects'), 'sympMode', 'Tuning');
  field($('#symp-selects'), 'sympKey', 'Key');
  field($('#symp-selects'), 'sympScale', 'Scale');
  // custom tuning: one note picker per string
  const noteGrid = $('#symp-custom');

    const id = `sympNote${i}`, def = PARAM_BY_ID[id];
    const s = document.createElement('select');
    s.className = 'param-select';
    s.title = def.name;
    for (let n = def.min; n <= def.max; n++) s.appendChild(new Option(noteNameOf(n), String(n)));
    s.addEventListener('change', () => setParam(id, Number(s.value)));
    s.addEventListener('keydown', (e) => e.stopPropagation());
    s.dataset.param = id;

  }

  // Bow · Expression
  $('#voice-mode').appendChild(control(Segmented, 'voiceMode').el);
  ['portaTime', 'vibRate', 'vibDepth', 'vibDelay'].forEach(id => knob($('#play-knobs'), id));
  field($('#play-selects'), 'vibSource', 'Vibrato');
  field($('#play-selects'), 'swellSource', 'Swell');
  field($('#play-selects'), 'keyswitchOctave', 'Keyswitches');
  ['releaseNoise', 'bowNoise', 'bendRange'].forEach(id => knob($('#play-knobs2'), id));

  // Output
  ['reverbSend', 'reverbDecay', 'width', 'master'].forEach(id => knob($('#output-knobs'), id));
  $('#voice-max').textContent = NUM_VOICES;

  // ---- contextual refresh: show what matters for the chosen articulation / body / tuning
  const KS_LABELS = ['ARCO', 'PIZZ', 'BARTÓK', 'BATT.', 'TRATTO', 'SPICC.', 'HARM.', 'MALLET', 'EBOW'];
  let liveExcitation = -1;
  function refresh(group) {
    if (!group || group === 'excite') {
      const e = Math.round(values.excitation);
      const bowed = BOWED_EXCITATIONS.includes(e);
      knobs.harmonic.el.classList.toggle('hidden', e !== EXC_HARMONIC);
      knobs.malletHardness.el.classList.toggle('hidden', e !== EXC_MALLET);
      ebowField.classList.toggle('hidden', e !== EXC_EBOW);
      knobs.bowSpeed.el.classList.toggle('hidden', !bowed && e !== EXC_SPICCATO);
      knobs.bowPressure.el.classList.toggle('hidden', !bowed && e !== EXC_SPICCATO);
      const posLabel = bowed || e === EXC_SPICCATO ? 'Bow Position' : e === EXC_MALLET ? 'Strike Point' : e === EXC_EBOW ? 'Driver Pos' : 'Pluck Point';
      knobs.bowPosition.el.querySelector('.knob-label').textContent = posLabel;
      renderExciteNote();
    }
    if (!group || group === 'body' || group === 'play') {
      const b = BODIES[Math.round(values.body)];
      $('#body-picture').innerHTML = bodyPictureSvg(b);
      $('#body-info').innerHTML =
        `<div class="row"><span>Strings</span><span>${b.strings.map(noteNameOf).join(' ')}</span></div>` +
        `<div class="row"><span>Range</span><span>${noteNameOf(b.rangeLo)}–${noteNameOf(b.rangeHi)}</span></div>` +
        `<div>${b.fretted ? '<span class="tag">FRETTED</span>' : ''}${b.electric ? '<span class="tag">PIEZO</span>' : '<span class="tag">ACOUSTIC</span>'}</div>` +
        `<div class="desc">${esc(BODY_DESC[Math.round(values.body)] || '')}</div>`;
      $('#amp-strip').classList.toggle('show', !!b.electric);
      $('#body-note').textContent = b.electric ? 'amp / DI stage active' : '';
      // keyswitch keys on the keyboard
      const ks = Math.round(values.keyswitchOctave);
      piano.setKeyswitches(ks === 0 ? -1 : (ks - 1) * 12, KS_LABELS);
    }
    if (!group || group === 'symp' || group === 'body') {
      const mode = Math.round(values.sympMode);
      $('#panel-symp').classList.toggle('off', values.sympOn < 0.5);
      $('#symp-selects [data-field="sympKey"]').classList.toggle('hidden', mode !== SYMP_SCALE);
      $('#symp-selects [data-field="sympScale"]').classList.toggle('hidden', mode !== SYMP_SCALE);
      noteGrid.classList.toggle('show', mode === SYMP_CUSTOM);
      const notes = sympatheticNotes(values);
      $('#symp-tuning').innerHTML = `<b>${notes.length}</b> strings: ${notes.map(noteNameOf).join(' ')}`;
      for (let i = 1; i <= MAX_SYMPATHETIC; i++) noteGrid.children[i - 1].style.visibility = i <= Math.round(values.sympCount) ? '' : 'hidden';
    }
    if (!group || group === 'strings') {
      const m = PARAM_BY_ID.material.choices[Math.round(values.material)];
      $('#strings-note').textContent = m;
    }
  }

  function renderExciteNote() {
    const chosen = Math.round(values.excitation);
    const note = $('#excite-note');
    if (liveExcitation >= 0 && liveExcitation !== chosen) {
      note.textContent = `keyswitch: ${EXCITATIONS[liveExcitation]}`;
      note.classList.add('ks');
    } else {
      note.textContent = '';
      note.classList.remove('ks');
    }
  }

  // ------------------------------------------------------------ keybed ----
  const piano = new Piano($('#piano'), {
    numKeys: 24, baseNote: 36,
    onNoteOn: (n, v) => noteOn(n, v),
    onNoteOff: (n) => noteOff(n),
  });

  function noteOn(note, vel) { engine.noteOn(note, vel); piano.setNote(note, true); }
  function noteOff(note) { engine.noteOff(note); piano.setNote(note, false); }

  engine.on('notes', ({ on, off }) => {
    off.forEach(n => piano.setNote(n, false));
    on.forEach(n => piano.setNote(n, true));
    flashLed();
    if (on.length) logMidi(`NOTE ON   ${on.map(n => `${midiNoteName(n)} (${n})`).join('  ')}`);
    else if (off.length) logMidi(`NOTE OFF  ${off.map(n => `${midiNoteName(n)} (${n})`).join('  ')}`);
  });

  function setOctave(base) {
    base = clamp(base, 0, 96);
    for (const [k, n] of heldKeys) { noteOff(n); heldKeys.delete(k); }
    piano.setBase(base);
    $('#octave-readout').textContent = `${midiNoteName(base)}–${midiNoteName(base + 23)}`;
  }
  $('#oct-down').addEventListener('click', () => setOctave(piano.base - 12));
  $('#oct-up').addEventListener('click', () => setOctave(piano.base + 12));

  // Computer keyboard: two rows, A = C
  const KEYMAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11,
                   k: 12, o: 13, l: 14, p: 15, ';': 16, "'": 17 };
  const heldKeys = new Map();
  window.addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || !modal.classList.contains('hidden')) return;
    const key = e.key.toLowerCase();
    if (key === 'z') { setOctave(piano.base - 12); return; }
    if (key === 'x') { setOctave(piano.base + 12); return; }
    if (key in KEYMAP && !heldKeys.has(key)) {
      const note = piano.base + KEYMAP[key];
      heldKeys.set(key, note);
      noteOn(note, 100);
    }
  });
  window.addEventListener('keyup', (e) => {
    const key = e.key.toLowerCase();
    if (heldKeys.has(key)) { noteOff(heldKeys.get(key)); heldKeys.delete(key); }
  });
  window.addEventListener('blur', () => { for (const [, n] of heldKeys) noteOff(n); heldKeys.clear(); });

  $('#panic-btn').addEventListener('click', () => {
    engine.panic();
    piano.clear();
    heldKeys.clear();
    logMidi('PANIC: all voices stopped');
  });

  const wheel = new ModWheel((v) => engine.modWheel(v));
  $('#wheel-slot').replaceWith(wheel.el);

  // ------------------------------------------------------------- stats -----
  const meterFill = $('#meter-fill');
  const meterClip = document.querySelector('.meter-clip');
  const sustainLed = $('#sustain-led');
  const midiLed = $('#midi-led');
  let clipTimer = 0, ledTimer = 0;
  function flashLed() { midiLed.classList.add('on'); clearTimeout(ledTimer); ledTimer = setTimeout(() => midiLed.classList.remove('on'), 120); }
  engine.on('stats', ({ voices, peak, sustain, modWheel, excitation }) => {
    $('#voice-count').textContent = voices;
    sustainLed.classList.toggle('on', !!sustain);
    if (typeof modWheel === 'number') wheel.setValue(modWheel);
    if (typeof excitation === 'number' && excitation !== liveExcitation) { liveExcitation = excitation; renderExciteNote(); }
    const db = 20 * Math.log10(Math.max(peak, 1e-5));
    meterFill.style.width = `${clamp((db + 60) / 60, 0, 1) * 100}%`;
    if (peak > 0.95) {
      meterClip.classList.add('on');
      clearTimeout(clipTimer);
      clipTimer = setTimeout(() => meterClip.classList.remove('on'), 800);
    }
  });

  let connectedOnce = false;
  engine.on('config', ({ sampleRate, blockSize, wrapper, audio, running }) => {
    const web = wrapper === 'Web';
    document.body.classList.toggle('web', web);
    const sr = sampleRate > 0 ? `${(sampleRate / 1000).toFixed(1)} kHz · ${blockSize} smp` : 'not playing yet';
    $('#audio-info').textContent = audio || `${wrapper} · ${sr}`;
    $('#audio-led').classList.toggle('on', running !== false);
    if (!connectedOnce) logMidi('Connected: play your MIDI controller, the keys, or A–\' on the computer keyboard');
    connectedOnce = true;
    fit();
  });

  const midiSelect = $('#midi-select');
  engine.on('midiInputs', ({ inputs, selected, error }) => {
    midiSelect.innerHTML = '';
    if (error) { midiSelect.appendChild(new Option('MIDI unavailable', 'all')); midiSelect.disabled = true; return; }
    midiSelect.disabled = false;
    midiSelect.appendChild(new Option(inputs.length ? `All inputs (${inputs.length})` : 'No MIDI devices', 'all'));
    inputs.forEach(d => midiSelect.appendChild(new Option(d.name + (d.state === 'connected' ? '' : ' (off)'), d.id)));
    midiSelect.value = Array.from(midiSelect.options).some(o => o.value === selected) ? selected : 'all';
  });
  midiSelect.addEventListener('change', () => engine.selectMidi(midiSelect.value));

  const monitor = $('#midi-monitor');
  function logMidi(text) { monitor.textContent = text; }

  // --------------------------------------------------------- fit window ----
  const synth = $('.synth');
  const coarse = window.matchMedia ? window.matchMedia('(pointer: coarse)') : null;
  function fit() {
    const body = document.body, vw = window.innerWidth, vh = window.innerHeight;
    body.classList.remove('compact', 'portrait');
    synth.style.zoom = '';
    const w = synth.offsetWidth + 24, h = synth.offsetHeight + 24;
    const s = Math.min(vw / w, vh / h);
    const compact = !!(coarse && coarse.matches) && (vh > vw || s < 0.8 * (vw / w));
    const svg = $('.piano-svg');
    if (svg) svg.setAttribute('preserveAspectRatio', compact && vh <= vw ? 'none' : 'xMidYMid meet');
    if (!compact) { synth.style.transform = `translateX(-50%) scale(${s})`; return; }
    body.classList.add('compact');
    body.classList.toggle('portrait', vh > vw);
    synth.style.transform = '';
    synth.style.zoom = String(Math.min(1.4, vw / (synth.offsetWidth + 12)));
  }
  window.addEventListener('resize', fit);

  // Right-click on any control = the host's parameter menu. Shift+right-click keeps the browser menu (Inspect).
  document.addEventListener('contextmenu', (e) => {
    if (!engine.connected || e.shiftKey) return;
    e.preventDefault();
    const ctl = e.target.closest('[data-param]');
    if (ctl) engine.paramMenu(ctl.dataset.param, e.clientX, e.clientY);
  });

  // -------------------------------------------------------------- init -----
  // UI preview outside the plugin: open index.html#body=6,excitation=8,sympOn=1 to see those settings
  if (!engine.connected && location.hash.length > 1) {
    for (const pair of location.hash.slice(1).split(',')) {
      const [id, v] = pair.split('=');
      if (PARAM_BY_ID[id] && v !== undefined && !isNaN(Number(v))) values[id] = clamp(Number(v), PARAM_BY_ID[id].min, PARAM_BY_ID[id].max);
    }
    for (const id in values) applyValue(id, values[id]);
  }
  renderPresetName();
  renderBrowser();
  refresh();
  setOctave(36);
  fit();
  if (engine.connected) engine.uiReady();
  else logMidi('Not running inside the plugin: no audio engine connected (UI preview only)');
})();

</script>
</body>
</html>
